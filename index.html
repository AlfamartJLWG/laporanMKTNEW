<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Sales & Market</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        accent: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(209, 250, 229, 0.8);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.05), 0 8px 10px -6px rgba(16, 185, 129, 0.05);
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6ee7b7;
        }
    </style>
</head>
<body class="bg-emerald-50/70 text-slate-800 antialiased min-h-screen pb-24 selection:bg-emerald-500 selection:text-white font-sans">

    <!-- Header / Navbar Modern - Background Hijau Muda -->
    <header class="bg-white/80 backdrop-blur-md border-b border-emerald-100 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-5 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-sky-500 rounded-2xl flex items-center justify-center text-white font-bold shadow-md shadow-emerald-500/20 text-lg">
                    🇮🇩
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base tracking-tight leading-tight">JATILAWANG</h1>
                    <p class="text-[11px] text-emerald-700 font-semibold tracking-wide uppercase">Store Performance</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Mode Switcher -->
                <div class="flex items-center bg-emerald-100/60 p-1 rounded-full border border-emerald-200/60">
                    <button class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-amber-500 shadow-sm text-xs transition">☀️</button>
                    <button class="w-7 h-7 text-slate-400 rounded-full flex items-center justify-center text-xs hover:text-slate-600 transition">🌙</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

        <!-- Card Informasi Shift & Petugas -->
        <section class="glass-card rounded-3xl p-6 transition-all hover:shadow-lg border-t-4 border-t-emerald-500">
            <div class="flex items-center justify-between mb-5">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-800/60">Informasi Shift & Toko</h2>
                </div>
                <span class="text-[11px] font-bold text-sky-700 bg-sky-50 border border-sky-100 px-3 py-1 rounded-full">Aktif</span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Tanggal</label>
                    <input type="date" id="tanggal" class="w-full px-3.5 py-2.5 bg-emerald-50/40 border border-emerald-100 rounded-xl text-sm font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Shift</label>
                    <input type="text" id="shift" placeholder="Pagi / 1" class="w-full px-3.5 py-2.5 bg-emerald-50/40 border border-emerald-100 rounded-xl text-sm font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:outline-none transition uppercase placeholder:text-slate-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Staf</label>
                    <input type="text" id="staf" placeholder="Nama Staf" class="w-full px-3.5 py-2.5 bg-emerald-50/40 border border-emerald-100 rounded-xl text-sm font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:outline-none transition uppercase placeholder:text-slate-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Crew</label>
                    <input type="text" id="crew" placeholder="Nama Crew" class="w-full px-3.5 py-2.5 bg-emerald-50/40 border border-emerald-100 rounded-xl text-sm font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:outline-none transition uppercase placeholder:text-slate-400">
                </div>
            </div>
        </section>

        <!-- Card Tabel Metrik & Input Actual -->
        <section class="glass-card rounded-3xl p-6 transition-all hover:shadow-lg border-t-4 border-t-sky-500">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-800/60">Pencapaian Metrik Sales</h2>
                <span class="text-[11px] text-emerald-700 font-medium bg-emerald-100/60 border border-emerald-200/60 px-2.5 py-1 rounded-lg">Target vs Actual</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-emerald-100 text-[11px] text-emerald-800/50 uppercase tracking-wider">
                            <th class="py-3 font-semibold w-2/5">Metrik</th>
                            <th class="py-3 font-semibold text-right w-1/4">Target</th>
                            <th class="py-3 font-semibold text-right w-1/3">Actual</th>
                        </tr>
                    </thead>
                    <tbody id="metric-fields" class="text-sm divide-y divide-emerald-50">
                        <!-- Baris tabel di-generate otomatis oleh script.js -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Card Tombol Aksi Utama -->
        <section class="space-y-3 pt-2">
            <button id="btn-submit" onclick="submitToSheets()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-emerald-600/25 transition-all duration-150 flex items-center justify-center space-x-2 text-sm tracking-wide">
                <span>🚀 Simpan ke Google Sheets</span>
            </button>
            <button onclick="resetActualOnly()" class="w-full py-3.5 bg-white hover:bg-emerald-50/50 active:scale-[0.99] text-sky-600 font-semibold rounded-2xl border border-sky-200/80 transition-all duration-150 text-sm shadow-sm">
                🔄 Reset Form Input
            </button>
        </section>

        <!-- Card Preview Hasil Teks WhatsApp -->
        <section class="glass-card rounded-3xl p-6 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-800/60">Pratinjau Format WhatsApp</h2>
                <button id="btn-copy" onclick="copyToClipboard()" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200/60 text-xs font-semibold rounded-xl transition-all">
                    📋 Salin Teks
                </button>
            </div>
            <textarea id="output-text" readonly rows="8" class="w-full p-4 bg-emerald-50/40 border border-emerald-100 rounded-2xl text-xs font-mono text-slate-600 focus:outline-none resize-none leading-relaxed"></textarea>
        </section>

    </main>

    <!-- Script Utama -->
    <script src="script.js"></script>
</body>
</html>
